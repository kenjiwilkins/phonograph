name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Same version as Vercel, which reads engines.node in package.json
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: eslint check
        if: always()
        run: yarn lint

      - name: prettier check
        run: yarn format:check

      - name: unit test
        run: yarn test:coverage

      - name: Build code
        run: yarn build:CI
